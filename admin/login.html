<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Sign In | CHS Blood Drive</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body class="auth-body"><main class="auth-card"><p class="eyebrow">Admin</p><h1>Sign in</h1><p>Authorized blood-drive administrators only.</p><form id="login-form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><p id="error" class="error" role="alert"></p><button id="submit" class="primary" type="submit">Sign In</button><a class="btn secondary" href="/">Back to registration</a><button id="forgot" class="secondary" type="button">Forgot password</button></form></main><script type="module" src="login.js"></script></body></html>
