<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Account Setup | CHS Blood Drive</title><link rel="stylesheet" href="admin.css"></head><body class="auth-body"><main class="auth-card"><p class="eyebrow">Hidden setup</p><h1>Create admin account</h1><p>This creates a Firebase Auth account and a disabled admins record. Dashboard access begins only after an organizer changes your admins record status to enabled in Firebase.</p><form id="signup-form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><p id="error" class="error" role="alert"></p><button id="submit" class="primary" type="submit">Create Account</button></form></main><script type="module" src="signup.js"></script></body></html>
